services:
  db:
    image: postgres:16-alpine
    container_name: railblock-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: railblock
      POSTGRES_PASSWORD: railblock_secret_2026
      POSTGRES_DB: railblock_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U railblock -d railblock_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - railblock-network

  backend:
    build:
      context: ./railblock-backend
      dockerfile: Dockerfile
    container_name: railblock-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      - DATABASE_URL=postgresql://railblock:railblock_secret_2026@db:5432/railblock_db
      - RAILBLOCK_JWT_SECRET=super-secret-railblock-key-2026-production-secure
      - PYTHONUNBUFFERED=1
    networks:
      - railblock-network

  frontend:
    build:
      context: ./SIH-Frontend
      dockerfile: Dockerfile
    container_name: railblock-frontend
    ports:
      - "3000:80"
    environment:
      - VITE_API_BASE_URL=http://localhost:8080/api
      - VITE_USE_MOCK=false
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - railblock-network

networks:
  railblock-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local

