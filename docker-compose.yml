services:
  backend:
    build:
      context: ./railblock-backend
      dockerfile: Dockerfile
    container_name: railblock-backend
    ports:
      - "8080:8080"
    environment:
      - RAILBLOCK_JWT_SECRET=super-secret-railblock-key-2026
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    networks:
      - railblock-network

  frontend:
    build:
      context: ./SIH-Frontend
      dockerfile: Dockerfile
    container_name: railblock-frontend
    ports:
      - "3000:80"
    environment:
      - VITE_API_BASE_URL=http://localhost:8080/api
      - VITE_USE_MOCK=false
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - railblock-network

networks:
  railblock-network:
    driver: bridge
